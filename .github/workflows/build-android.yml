name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web assets in www/
        run: |
          mkdir -p www
          cp index.html style.css app.js manifest.json icon.svg www/

      - name: Install Capacitor & Add Android Platform
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload StardewSchedule APK
        uses: actions/upload-artifact@v4
        with:
          name: StardewSchedule-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
